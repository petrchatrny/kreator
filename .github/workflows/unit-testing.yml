name: Unit testing
on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
jobs:
  publish:
    name: Build and run Unit test
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: 21

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew :kreator-compiler:test
